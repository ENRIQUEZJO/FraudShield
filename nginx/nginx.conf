# nginx/nginx.conf
#
# nginx cumple TRES roles a la vez en este proyecto:
#   1. Termina el HTTPS (el navegador le habla a nginx en HTTPS; nginx
#      le habla al backend en HTTP plano, dentro de la red privada de
#      Docker — el backend en sí NO necesita saber nada de certificados).
#   2. Reparte las peticiones /api/* entre TODAS las réplicas del
#      backend que estén corriendo (balanceo de carga) — así es como
#      se logra "escalar a varios servidores backend a la vez".
#   3. Sirve los archivos estáticos del frontend (el resultado de
#      "npm run build").

# "upstream" define el grupo de servidores backend entre los que nginx
# va a repartir las peticiones. "backend" es el nombre del servicio en
# docker-compose.yml — Docker resuelve ese nombre a las IPs de TODAS
# las réplicas activas automáticamente (round-robin por defecto: cada
# petición nueva va al siguiente contenedor de la lista, en orden).
upstream fraudshield_backend {
    server backend:8000;
    # Si escalas con "docker-compose up --scale backend=3", Docker crea
    # 3 contenedores todos respondiendo al nombre "backend" — nginx los
    # descubre solo, no hace falta listar cada uno a mano aquí.
}

# Servidor en el puerto 80 (HTTP normal): su ÚNICA función es redirigir
# todo a HTTPS. Nadie debería quedarse navegando en HTTP sin cifrar.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Servidor principal, en el puerto 443 (HTTPS).
server {
    listen 443 ssl;
    server_name _;

    # Rutas a los archivos del certificado — ver docs/DESPLIEGUE.md para
    # cómo generarlos (autofirmado para pruebas, o Let's Encrypt para producción).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Configuración de seguridad TLS razonable para 2026 — solo protocolos
    # modernos, sin las versiones viejas de TLS que ya se consideran inseguras.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Tamaño máximo de una petición — una foto en base64 (usada en el
    # registro/verificación facial) puede pesar varios MB. Sin esto,
    # nginx rechazaría fotos grandes con un error 413.
    client_max_body_size 10M;

    # Todo lo que empiece con /api/ se manda al grupo de backends
    # definido arriba, NUNCA se sirve como archivo estático.
    location /api/ {
        proxy_pass http://fraudshield_backend;

        # Estos headers le dicen al backend datos reales de la petición
        # original (IP del cliente, si vino por HTTPS, etc.) — sin
        # ellos, el backend vería todas las peticiones como si vinieran
        # de nginx mismo, perdiendo esa información.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempo de espera más generoso que el default de nginx (60s) —
        # la verificación facial con DeepFace puede tardar unos segundos
        # en máquinas sin GPU, no queremos que nginx corte la conexión
        # antes de que el backend termine de responder.
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Todo lo demás (cualquier ruta que no empiece con /api/) se sirve
    # como archivo estático del frontend ya compilado.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  # necesario para que las rutas de React (SPA) funcionen al recargar la página
    }
}
